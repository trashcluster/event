<!DOCTYPE html>

<title>Program – 1. april</title>

<style>
:root {
  /* base (dark-only) */
  --bg: #0b0b0b;
  --text: #ffffff;
  --muted: #9ca3af;

  /* subject colors (cards) */
  --color-food: #1f3d1a;       /* dark green */
  --color-activity: #7c2a2a;   /* dark red */
  --color-meeting: #b08a00;    /* dark yellow */
  --color-logistic: #334155;   /* slate */

  /* soft variants (subcards) */
  --color-food-soft: #2a4f23;
  --color-activity-soft: #a03a3a;
  --color-meeting-soft: #d1a300;
  --color-logistic-soft: #475569;

  /* radii */
  --radius-lg: 22px; /* default card radius */
  --radius-md: 16px; /* default subcard radius */
  
  /* canvas */
  --canvas-w: 550px;
  --canvas-h: 1860px;
}

* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  min-width: 1280px;
}

/* two-pane layout: fixed editor left, scrollable viz right */
.layout {
  display: flex;
  align-items: stretch;
  justify-content: flex-start;
  height: 100vh;
  width: 100vw;
}

.layout .controls {
  flex: 0 0 640px;
  height: 100vh;
  overflow-y: auto;
  position: relative;
  z-index: 10;
  background: var(--bg);
  padding: 0;
}

.canvas-container {
  flex: 1;
  height: 100vh;
  overflow: auto;
  position: relative;
}

.stage-scaler{}
.app {
  width: var(--canvas-w);
  height: var(--canvas-h);
  max-width: 100%;
  padding: 28px 18px 40px;
  outline: 1px dashed rgba(255,255,255,0.22);
  overflow: hidden;
  flex-shrink: 0;
}

.apps-row {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  justify-content: flex-start;
  width: fit-content;
}

.header {
  text-align: center;
  margin-bottom: 24px;
}

.header .weekday {
  letter-spacing: 2px;
  color: var(--muted);
  font-size: 14px;
}

.header .date {
  font-size: 34px;
  font-weight: 700;
}

.card {
  border-radius: var(--radius-lg);
  padding: 18px 18px 20px;
  margin-bottom: 14px;
}

.card.small {
  padding: 14px 16px;
}

/* subjects map to variables */
.is-food { background: var(--color-food); }
.is-activity { background: var(--color-activity); }
.is-meeting { background: var(--color-meeting); color: #000; }
.is-logistic { background: var(--color-logistic); }

.time {
  font-size: 14px;
  opacity: 0.9;
}

.title {
  font-size: 26px;
  font-weight: 700;
  margin-top: 2px;
}

.location {
  opacity: 0.85;
}

.stack {
  margin-top: 14px;
  display: grid;
  gap: 12px;
}

.subcard {
  border-radius: var(--radius-md);
  padding: 14px 16px;
}

/* soft backgrounds for subcards */
.is-food-soft { background: var(--color-food-soft); }
.is-activity-soft { background: var(--color-activity-soft); }
.is-meeting-soft { background: var(--color-meeting-soft); color: #000; }
.is-logistic-soft { background: var(--color-logistic-soft); }

.subcard .title {
  font-size: 22px;
}

.subcard .time {
  font-size: 13px;
}

.subnote {
  font-size: 14px;
  opacity: 0.85;
}

.icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 12px;
  flex-shrink: 0;
}

.row {
  display: flex;
  align-items: center;
}

.row.top {
  align-items: flex-start;
}

/* Pad card visuals */
.is-pad { background: transparent !important; }
.pad-card { 
  background: transparent !important; 
  padding: 0; 
  border-radius: var(--radius-lg);
  display:flex;align-items:center;justify-content:center;
}
.pad-image-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.pad-image-wrap img{width:60%;height:auto;max-height:100%;object-fit:contain;display:block}
</style>

<style>
/* control panel styles (inline so we don't edit head) */
.controls {

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
// ---------- Simple, refactored state ----------
function getTodayHeader(){
  const d = new Date();
  const weekday = d.toLocaleDateString('fr-FR', { weekday: 'long' }).toUpperCase();
  const date = d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
  return { weekday, date };
}
const SUBJECTS = {
  food: { label: 'Food', icon: '🍽️' },
  activity: { label: 'Activity', icon: '🏃' },
  meeting: { label: 'Meeting', icon: '👥' },
  logistic: { label: 'Logistic', icon: '📦' },
  pad: { label: 'Pad (image)', icon: '' },
};

// Dark-only presets with per-subject colors
const PRESETS = {
  PC26: {
    name: 'PC26',
    bg: '#0b0b0b',
    text: '#fdfee7',
    subjects: {
      food: '#1f3314',      // Lunch
      activity: '#842a2a',  // Activity
      meeting: '#b99400',   // Meeting
      logistic: '#103240'   // Logistic
    },
    subjectsSoft: {
      food: '#365922',
      activity: '#cc5252',
      meeting: '#9d7d00',
      logistic: '#103240'
    },
    radius: 22,
  },
  ocean: {
    name: 'Ocean',
    bg: '#0b1220', 
    text:'#e6f0f6',
    subjects: { 
      food:'#036b66', 
      activity:'#0a3a5a', 
      meeting:'#1e293b', 
      logistic:'#475569' 
    },
    radius: 22,
  },
  sunset: {
    name: 'Sunset',
    bg: '#1a0b0b', 
    text:'#fff5f3',
    subjects: { 
      food:'#8a3a28', 
      activity:'#a24141', 
      meeting:'#c27c2a', 
      logistic:'#5a3a5a' 
    },
    radius: 22,
  },
  forest: {
    name: 'Forest',
    bg: '#0b0f0b', 
    text:'#eef7f0',
    subjects: { 
      food:'#1f3d1a', 
      activity:'#2e3a24', 
      meeting:'#355f2a', 
      logistic:'#26443a' 
    },
    radius: 22,
  },
  mono: {
    name: 'Mono',
    bg: '#0b0b0b', 
    text:'#f3f4f6',
    subjects: { 
      food:'#2b2b2b', 
      activity:'#3a3a3a', 
      meeting:'#4b4b4b', 
      logistic:'#5c5c5c' 
    },
    radius: 22,
  }
};

const state = {
  // Multi-day support
  days: [],
  currentDay: 0,
  // Global styling preset
  preset: 'PC26',
  custom: {
    bg: '#0b0b0b', 
    text:'#ffffff',
    subjects: { 
      food:'#1f3d1a', 
      activity:'#7c2a2a', 
      meeting:'#b08a00', 
      logistic:'#334155' 
    },
    radius: 22,
  },
  canvas: { width: 550, height: 1300 },
  unitCardHeight: 0,
};

// ---------- Utilities ----------
function hexToRgb(hex){
  const h = hex.replace('#','');
  return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
}
function mixHex(hex, amount){ // mix with white for soft background
  const {r,g,b} = hexToRgb(hex);
  const R = Math.round(r + (255 - r) * amount);
  const G = Math.round(g + (255 - g) * amount);
  const B = Math.round(b + (255 - b) * amount);
  return `rgb(${R},${G},${B})`;
}
function setCssVars(colors){
  const root = document.documentElement.style;
  root.setProperty('--bg', colors.bg);
  root.setProperty('--text', colors.text);
  root.setProperty('--muted', 'rgba(255,255,255,0.7)');
  root.setProperty('--color-food', colors.subjects.food);
  root.setProperty('--color-activity', colors.subjects.activity);
  root.setProperty('--color-meeting', colors.subjects.meeting);
  root.setProperty('--color-logistic', colors.subjects.logistic || '#334155');
  const soft = colors.subjectsSoft || {};
  root.setProperty('--color-food-soft', soft.food || mixHex(colors.subjects.food, 0.25));
  root.setProperty('--color-activity-soft', soft.activity || mixHex(colors.subjects.activity, 0.25));
  root.setProperty('--color-meeting-soft', soft.meeting || mixHex(colors.subjects.meeting, 0.25));
  root.setProperty('--color-logistic-soft', soft.logistic || mixHex(colors.subjects.logistic || '#334155', 0.25));
  root.setProperty('--radius-lg', (colors.radius||22)+'px');
  root.setProperty('--radius-md', Math.max(8, (colors.radius||22) - 6)+'px');
}

function setCanvasVars(width, height){
  const root = document.documentElement.style;
  root.setProperty('--canvas-w', width + 'px');
  root.setProperty('--canvas-h', height + 'px');
}

function currentColors(){
  if (state.preset === 'custom') return state.custom;
  const p = PRESETS[state.preset] || PRESETS.ocean;
  return { bg:p.bg, text:p.text, subjects:p.subjects, radius:p.radius };
}

function updatePalettePreview(){
  const preview = document.getElementById('palettePreview');
  if (!preview) return;
  const c = currentColors();
  preview.style.background = `linear-gradient(90deg, ${c.subjects.food}, ${c.subjects.activity}, ${c.subjects.meeting}, ${c.subjects.logistic||'#334155'})`;
  preview.textContent = 'Preview';
}

// Fit the canvas stage into the viewport below the controls without scrolling
// no viewport scaling; canvas is rendered at exact pixel size

// ---------- Persistence (localStorage + cookies fallback) ----------
const STORAGE_KEY = 'event_state';
const COOKIE_PREFIX = 'evs_';
const COOKIE_COUNT = 'evs_count';

function cloneStateForCookie(){
  // Cookies have very limited space; strip large image data
  const s = JSON.parse(JSON.stringify(state));
  if (Array.isArray(s.days)){
    s.days.forEach(day=>{
      (day.cards||[]).forEach(c=>{ if (c.padImage) c.padImage = ''; });
    });
  } else if (s.cards && s.cards.length){
    s.cards.forEach(c=>{ if (c.padImage) c.padImage = ''; });
  }
  return s;
}

function serializeState(stripImages=false){
  try {
    const s = stripImages ? cloneStateForCookie() : state;
    return JSON.stringify(s);
  } catch(e){ return ''; }
}

function persistLocal(){
  try{ localStorage.setItem(STORAGE_KEY, serializeState(false)); }catch(e){}
}

function loadLocal(){
  try{ const txt = localStorage.getItem(STORAGE_KEY); if (!txt) return null; return JSON.parse(txt); }catch(e){ return null; }
}

function setCookie(name, value, days){
  const d = new Date(); d.setTime(d.getTime() + (days*24*60*60*1000));
  const expires = '; expires=' + d.toUTCString();
  document.cookie = name + '=' + encodeURIComponent(value) + expires + '; path=/';
}
function getCookie(name){
  const cname = name + '=';
  const ca = document.cookie.split(';');
  for (let i=0;i<ca.length;i++){ let c = ca[i].trim(); if (c.indexOf(cname)===0) return decodeURIComponent(c.substring(cname.length,c.length)); }
  return null;
}
function deleteCookie(name){ setCookie(name,'',-1); }

function persistCookies(){
  const data = serializeState(true); // stripped images
  // clear previous chunks
  const prevCount = parseInt(getCookie(COOKIE_COUNT)||'0',10) || 0;
  for(let i=0;i<prevCount;i++) deleteCookie(COOKIE_PREFIX + i);
  deleteCookie(COOKIE_COUNT);
  // chunk the data into ~3500 char per cookie
  const chunkSize = 3500;
  const chunks = Math.ceil(data.length / chunkSize);
  for(let i=0;i<chunks;i++){
    const part = data.slice(i*chunkSize, (i+1)*chunkSize);
    setCookie(COOKIE_PREFIX + i, part, 30);
  }
  setCookie(COOKIE_COUNT, String(chunks), 30);
}

function loadCookies(){
  const count = parseInt(getCookie(COOKIE_COUNT)||'0',10) || 0;
  if (!count) return null;
  let data = '';
  for(let i=0;i<count;i++){
    const part = getCookie(COOKIE_PREFIX + i) || '';
    data += part;
  }
  try{ return JSON.parse(data); }catch(e){ return null; }
}

function persistState(){
  persistLocal();
  persistCookies();
}

function restoreState(){
  // Prefer localStorage (can store images); fall back to cookies
  const local = loadLocal();
  if (local){ Object.assign(state, local); return true; }
  const cookies = loadCookies();
  if (cookies){ Object.assign(state, cookies); return true; }
  return false;
}

// Measure the height of an empty food card to use as pad unit height
function measureUnitCardHeight(){
  const app = document.querySelector('.apps-row .app') || document.body;
  const probe = document.createElement('div');
  probe.className = 'card is-food';
  probe.style.position = 'absolute';
  probe.style.visibility = 'hidden';
  probe.style.left = '-9999px';
  probe.innerHTML = `<div class='row'><div class='icon'>${SUBJECTS.food.icon}</div><div><div class='title'>&nbsp;</div></div></div>`;
  app.appendChild(probe);
  const h = probe.offsetHeight || 200;
  app.removeChild(probe);
  state.unitCardHeight = h;
}

// ---------- Share (export/import) ----------
function buildShare(){
  // Construct a portable snapshot of the page
  return {
    v: 2,
    days: state.days,
    currentDay: state.currentDay,
    preset: state.preset,
    custom: state.custom,
    canvas: state.canvas,
  };
}

function exportShareString(){
  try{
    const txt = JSON.stringify(buildShare());
    const el = document.getElementById('shareString');
    if (el) el.value = txt;
  }catch(err){
    alert('Export failed: ' + err);
  }
}

function applyShare(obj){
  if (!obj || typeof obj !== 'object') throw new Error('Invalid data');
  const next = JSON.parse(JSON.stringify(obj));
  // minimal shape checks and defaults (v2 supports days; v1 fallback)
  if (Array.isArray(next.days)){
    state.days = next.days;
    state.currentDay = Math.max(0, Math.min(next.currentDay||0, state.days.length-1));
  } else {
    const header = next.header && next.header.weekday && next.header.date ? next.header : getTodayHeader();
    const cards = Array.isArray(next.cards) ? next.cards : [];
    state.days = [{ header, cards }];
    state.currentDay = 0;
  }
  if (!next.preset) next.preset = 'ocean';
  state.preset = next.preset;
  state.custom = next.custom || state.custom;
  state.canvas = next.canvas || state.canvas;

  // sync UI controls
  setCanvasVars(state.canvas.width, state.canvas.height);
  const active = getActiveDay();
  const w = document.getElementById('weekdayInput'); if (w) w.value = active.header.weekday;
  const d = document.getElementById('dateInput'); if (d) d.value = active.header.date;
  const cw = document.getElementById('canvasW'); if (cw) cw.value = state.canvas.width;
  const ch = document.getElementById('canvasH'); if (ch) ch.value = state.canvas.height;
  const pp = document.getElementById('palettePreset'); if (pp) pp.value = state.preset;
  renderDaySelector();

  applyPreset(state.preset);
  updatePalettePreview();
  renderCardControls();
  renderAll();
}

function importShareString(){
  try{
    const el = document.getElementById('shareString');
    const txt = el ? el.value : '';
    if (!txt) { alert('Paste a JSON string first.'); return; }
    const data = JSON.parse(txt);
    applyShare(data);
  }catch(err){
    alert('Import failed: ' + err);
  }
}

// ---------- Controls rendering ----------
function getActiveDay(){ return state.days[state.currentDay] || { header:getTodayHeader(), cards:[] }; }

function renderCardControls(){
  const container = document.getElementById('cardControls');
  container.innerHTML = '';
  const day = getActiveDay();
  day.cards.forEach((card, i)=>{
    const row = document.createElement('div');
    row.className = 'card-row';
    const isPad = card.subject === 'pad';
    row.innerHTML = `
      <div class="content">
        ${isPad ? `
          <div style="display:flex;gap:8px;align-items:center;width:100%;flex-wrap:nowrap">
            <select class="field card-subject" data-i="${i}" style="min-width:130px">
              ${Object.keys(SUBJECTS).map(k=>`<option value="${k}" ${card.subject===k?'selected':''}>${SUBJECTS[k].label}</option>`).join('')}
            </select>
            <input type="file" accept="image/*" class="field pad-file" data-i="${i}" style="flex:1;min-width:160px">
            <input type="number" min="1" value="${card.padUnits||1}" class="field pad-units" data-i="${i}" title="Pad height (units)" style="width:120px"/>
            <button class="remove-btn" data-i="${i}" title="Remove card" aria-label="Remove card" style="margin-left:auto">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M3 6h18v2H3V6zm2 3h14l-1.5 12.5a2 2 0 0 1-2 1.5H8.5a2 2 0 0 1-2-1.5L5 9zm3-6h8v2H8V3z"/></svg>
            </button>
          </div>
        ` : `
          <div class="card-top" style="display:flex;gap:8px;align-items:center;width:100%;flex-wrap:nowrap;justify-content:space-between">
            <div style="display:flex;gap:8px;align-items:center;flex:1;min-width:0">
              <select class="field card-subject" data-i="${i}" style="min-width:130px">
                ${Object.keys(SUBJECTS).map(k=>`<option value="${k}" ${card.subject===k?'selected':''}>${SUBJECTS[k].label}</option>`).join('')}
              </select>
              <input type="text" data-i="${i}" class="field card-title" placeholder="Title" value="${card.title||''}" style="flex:1;min-width:160px">
            </div>
            <button class="remove-btn" data-i="${i}" title="Remove card" aria-label="Remove card">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M3 6h18v2H3V6zm2 3h14l-1.5 12.5a2 2 0 0 1-2 1.5H8.5a2 2 0 0 1-2-1.5L5 9zm3-6h8v2H8V3z"/></svg>
            </button>
          </div>
          <div class="card-bottom" style="display:flex;gap:8px;align-items:center;width:100%;flex-wrap:nowrap;margin-top:6px">
            <input type="time" class="time-start field" data-i="${i}" value="${card.timeStart||''}">
            <span>—</span>
            <input type="time" class="time-end field" data-i="${i}" value="${card.timeEnd||''}">
            <input type="text" class="field card-location" data-i="${i}" placeholder="Location" value="${card.location||''}" style="min-width:140px;flex:1">
            <input type="number" min="1" value="${card.cardUnits||1}" class="field card-units" data-i="${i}" title="Card height (units)" style="width:120px">
          </div>
        `}
        ${isPad ? `` : `
        <div class="sub-block">
          <div class="muted">Subcards</div>
          <div class="sub-list" data-i="${i}"></div>
          <div style="margin-top:6px">
            <button class="button add-sub" data-i="${i}" style="padding:6px 8px">+ Add subcard</button>
          </div>
        </div>`}
      </div>
    `;
    container.appendChild(row);
  });

  // Attach listeners for card fields
  container.querySelectorAll('.card-title').forEach(inp=>{
    inp.addEventListener('input', (e)=>{ const i=+e.target.dataset.i; getActiveDay().cards[i].title = e.target.value; renderAll(); });
  });
  container.querySelectorAll('.card-subject').forEach(sel=>{
    sel.addEventListener('change', (e)=>{ const i=+e.target.dataset.i; getActiveDay().cards[i].subject = e.target.value; renderCardControls(); renderAll(); });
  });
  container.querySelectorAll('.time-start').forEach(inp=>{
    inp.addEventListener('input', (e)=>{ const i=+e.target.dataset.i; getActiveDay().cards[i].timeStart = e.target.value; validateTimePair(i); renderAll(); });
  });
  container.querySelectorAll('.time-end').forEach(inp=>{
    inp.addEventListener('input', (e)=>{ const i=+e.target.dataset.i; getActiveDay().cards[i].timeEnd = e.target.value; validateTimePair(i); renderAll(); });
  });
  container.querySelectorAll('.card-location').forEach(inp=>{
    inp.addEventListener('input', (e)=>{ const i=+e.target.dataset.i; getActiveDay().cards[i].location = e.target.value; renderAll(); });
  });
  container.querySelectorAll('.card-units').forEach(inp=>{
    inp.addEventListener('input', (e)=>{ const i=+e.target.dataset.i; const v = Math.max(1, parseInt(e.target.value||'1',10)); getActiveDay().cards[i].cardUnits = v; renderAll(); });
  });
  // pad file handler
  container.querySelectorAll('.pad-file').forEach(inp=>{
    inp.addEventListener('change', (e)=>{
      const i = +e.target.dataset.i; const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { alert('Please select an image file.'); return; }
      const reader = new FileReader();
      reader.onload = () => { getActiveDay().cards[i].padImage = reader.result; renderAll(); };
      reader.readAsDataURL(file);
    });
  });
  // pad units handler
  container.querySelectorAll('.pad-units').forEach(inp=>{
    inp.addEventListener('input', (e)=>{ const i=+e.target.dataset.i; const v = Math.max(1, parseInt(e.target.value||'1',10)); getActiveDay().cards[i].padUnits = v; renderAll(); });
  });
  container.querySelectorAll('button.remove-btn[data-i]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ const i=+e.currentTarget.dataset.i; removeCardAt(i); });
  });

  // Add subcard buttons
  container.querySelectorAll('button.add-sub').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ const i=+e.currentTarget.dataset.i; addSubcard(i); });
  });

  // Render sublists
  container.querySelectorAll('.sub-list').forEach(list=>{
    const i = +list.dataset.i;
    const subs = getActiveDay().cards[i].subs || [];
    list.innerHTML = '';
    subs.forEach((s,si)=>{
      const el = document.createElement('div');
      el.className = 'sub-item';
      el.innerHTML = `
        <div class="sub-top">
          <select class="field sub-subject" data-i="${i}" data-si="${si}" style="min-width:120px">
            ${Object.keys(SUBJECTS).map(k=>`<option value="${k}" ${s.subject===k?'selected':''}>${SUBJECTS[k].label}</option>`).join('')}
          </select>
          <input class="field sub-title" data-i="${i}" data-si="${si}" placeholder="Sub title" value="${s.title||''}" style="flex:1;min-width:140px">
          <button class="remove-btn small" data-i="${i}" data-si="${si}" title="Remove sub" aria-label="Remove sub" style="margin-left:auto">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M3 6h18v2H3V6zm2 3h14l-1.5 12.5a2 2 0 0 1-2 1.5H8.5a2 2 0 0 1-2-1.5L5 9zm3-6h8v2H8V3z"/></svg>
          </button>
        </div>
        <div class="sub-bottom">
          <div class="time-group">
            <input type="time" class="field sub-time-start" data-i="${i}" data-si="${si}" value="${s.timeStart||''}">
            <span>—</span>
            <input type="time" class="field sub-time-end" data-i="${i}" data-si="${si}" value="${s.timeEnd||''}">
            <input class="field sub-location" data-i="${i}" data-si="${si}" placeholder="Location" value="${s.location||''}" style="min-width:140px">
          </div>
        </div>
      `;
      list.appendChild(el);
    });

    // listeners
    list.querySelectorAll('.sub-title').forEach(inp=>{
      inp.addEventListener('input', (e)=>{ const i=+e.target.dataset.i, si=+e.target.dataset.si; getActiveDay().cards[i].subs[si].title = e.target.value; renderAll(); });
    });
    list.querySelectorAll('.sub-subject').forEach(sel=>{
      sel.addEventListener('change', (e)=>{ const i=+e.target.dataset.i, si=+e.target.dataset.si; getActiveDay().cards[i].subs[si].subject = e.target.value; renderAll(); });
    });
    list.querySelectorAll('.sub-time-start').forEach(inp=>{
      inp.addEventListener('input', (e)=>{ const i=+e.target.dataset.i, si=+e.target.dataset.si; getActiveDay().cards[i].subs[si].timeStart = e.target.value; validateSubTimePair(i,si); renderAll(); });
    });
    list.querySelectorAll('.sub-time-end').forEach(inp=>{
      inp.addEventListener('input', (e)=>{ const i=+e.target.dataset.i, si=+e.target.dataset.si; getActiveDay().cards[i].subs[si].timeEnd = e.target.value; validateSubTimePair(i,si); renderAll(); });
    });
    list.querySelectorAll('.sub-location').forEach(inp=>{
      inp.addEventListener('input', (e)=>{ const i=+e.target.dataset.i, si=+e.target.dataset.si; getActiveDay().cards[i].subs[si].location = e.target.value; renderAll(); });
    });
    list.querySelectorAll('button.remove-btn.small').forEach(btn=>{
      btn.addEventListener('click', (e)=>{ const i=+e.currentTarget.dataset.i, si=+e.currentTarget.dataset.si; removeSubcard(i,si); });
    });
  });
}

// ---------- Validation ----------
function timeToMinutes(v){ if(!v) return null; const parts=v.split(':'); if(parts.length!==2) return null; return parseInt(parts[0],10)*60+parseInt(parts[1],10); }
function validateTimePair(i){
  const s = getActiveDay().cards[i].timeStart, e = getActiveDay().cards[i].timeEnd;
  const ok = !s || !e || timeToMinutes(s) < timeToMinutes(e);
  const sEl = document.querySelector(`.time-start[data-i="${i}"]`);
  const eEl = document.querySelector(`.time-end[data-i="${i}"]`);
  [sEl,eEl].forEach(el=>{ if(!el) return; el.classList.toggle('invalid', !ok && s && e); });
}
function validateSubTimePair(i,si){
  const s = getActiveDay().cards[i].subs[si].timeStart, e = getActiveDay().cards[i].subs[si].timeEnd;
  const ok = !s || !e || timeToMinutes(s) < timeToMinutes(e);
  const sEl = document.querySelector(`.sub-time-start[data-i="${i}"][data-si="${si}"]`);
  const eEl = document.querySelector(`.sub-time-end[data-i="${i}"][data-si="${si}"]`);
  [sEl,eEl].forEach(el=>{ if(!el) return; el.classList.toggle('invalid', !ok && s && e); });
}

// ---------- State mutators ----------
function addCard(){
  getActiveDay().cards.push({ subject:'food', title:'', timeStart:'', timeEnd:'', location:'', cardUnits:1, subs:[], padImage:'' });
  renderCardControls();
  renderAll();
}
function removeCardAt(index){
  const day = getActiveDay();
  if (index<0 || index>=day.cards.length) return;
  day.cards.splice(index,1);
  renderCardControls();
  renderAll();
}
function addSubcard(cardIndex){
  const day = getActiveDay();
  day.cards[cardIndex].subs.push({ subject: day.cards[cardIndex].subject, title:'', timeStart:'', timeEnd:'', location:'' });
  renderCardControls();
  renderAll();
}
function removeSubcard(cardIndex, subIndex){
  getActiveDay().cards[cardIndex].subs.splice(subIndex,1);
  renderCardControls();
  renderAll();
}
function clearAll(){
  const day = getActiveDay();
  day.cards = [];
  // reset header to today's date and sync inputs
  if (typeof getTodayHeader === 'function') {
    day.header = getTodayHeader();
    const w = document.getElementById('weekdayInput');
    const d = document.getElementById('dateInput');
    if (w) w.value = day.header.weekday;
    if (d) d.value = day.header.date;
  }
  renderCardControls();
  renderAll();
}

// ---------- Rendering of final layout ----------
function generateDay(day, targetEl){
  const colors = currentColors();
  setCssVars(colors);
  const app = targetEl;
  let html = '';
  html += `<div class="header"><div class="weekday">${day.header.weekday}</div><div class="date">${day.header.date}</div></div>`;
  day.cards.forEach(card=>{
    const subj = card.subject || 'food';
    if (subj === 'pad') {
      const units = Math.max(1, card.padUnits||1);
      const px = Math.max(1, state.unitCardHeight||200) * units;
      html += `<div class='card pad-card is-pad' style='min-height:${px}px'>`;
      if (card.padImage) {
        html += `<div class='pad-image-wrap'><img src='${card.padImage}' alt='Pad image'></div>`;
      } else {
        html += `<div class='pad-image-wrap'></div>`;
      }
      html += `</div>`;
    } else {
      const icon = SUBJECTS[subj].icon;
      const ctime = (card.timeStart && card.timeEnd && timeToMinutes(card.timeStart)<timeToMinutes(card.timeEnd)) ? `${card.timeStart}–${card.timeEnd}` : '';
      const cloc = (card.location||'').trim();
      let timeText = '';
      if (ctime && cloc) timeText = `${ctime} · ${cloc}`;
      else if (ctime) timeText = ctime;
      else if (cloc) timeText = cloc;
      const timeHtml = timeText ? `<div class='time'>${timeText}</div>` : '';
      const cunits = Math.max(1, card.cardUnits||1);
      const cpx = Math.max(1, state.unitCardHeight||200) * cunits;
      html += `<div class='card is-${subj}' style='min-height:${cpx}px'>`;
      html += `<div class='row'><div class='icon'>${icon}</div><div>${timeHtml}<div class='title'>${card.title||''}</div></div></div>`;
      if ((card.subs||[]).length){
        html += `<div class='stack'>`;
        card.subs.forEach((s)=>{
          const ssubj = s.subject || subj;
          const sicon = SUBJECTS[ssubj].icon;
          const stime = (s.timeStart && s.timeEnd && timeToMinutes(s.timeStart)<timeToMinutes(s.timeEnd)) ? `${s.timeStart}–${s.timeEnd}` : '';
          const sloc = (s.location||'').trim();
          let sText = '';
          if (stime && sloc) sText = `${stime} · ${sloc}`;
          else if (stime) sText = stime;
          else if (sloc) sText = sloc;
          const sTimeHtml = sText ? `<div class='time'>${sText}</div>` : '';
          html += `<div class='subcard is-${ssubj}-soft'><div class='row'><div class='icon'>${sicon}</div><div>${sTimeHtml}<div class='title'>${s.title||''}</div></div></div></div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    }
  });
  app.innerHTML = html;
}

function renderAll(){
  const row = document.getElementById('appsRow');
  row.innerHTML = '';
  state.days.forEach((day, idx)=>{
    const col = document.createElement('div');
    col.className = 'app';
    col.id = 'appRoot-' + idx;
    row.appendChild(col);
    generateDay(day, col);
  });
  persistState();
}

// ---------- Presets & custom UI ----------
function applyPreset(name){
  state.preset = name;
  const customBlock = document.getElementById('customBlock');
  if (name === 'custom') {
    customBlock.style.display = 'block';
    // sync inputs with current custom state
    document.getElementById('bgColor').value = state.custom.bg;
    document.getElementById('textColor').value = state.custom.text;
    document.getElementById('colorFood').value = state.custom.subjects.food;
    document.getElementById('colorActivity').value = state.custom.subjects.activity;
    document.getElementById('colorMeeting').value = state.custom.subjects.meeting;
    const cl = document.getElementById('colorLogistic'); if (cl) cl.value = state.custom.subjects.logistic || '#334155';
    document.getElementById('radius').value = state.custom.radius;
  } else {
    customBlock.style.display = 'none';
  }
  updatePalettePreview();
  renderAll(); // immediate update
}

// preview updates for custom inputs
['bgColor','textColor','colorFood','colorActivity','colorMeeting','colorLogistic','radius'].forEach(id=>{
  document.addEventListener('input', (e)=>{
    if (e.target && e.target.id === id){
      if (state.preset !== 'custom') return; // only when custom
      if (id==='bgColor') state.custom.bg = e.target.value;
      if (id==='textColor') state.custom.text = e.target.value;
      if (id==='colorFood') state.custom.subjects.food = e.target.value;
      if (id==='colorActivity') state.custom.subjects.activity = e.target.value;
      if (id==='colorMeeting') state.custom.subjects.meeting = e.target.value;
      if (id==='colorLogistic') state.custom.subjects.logistic = e.target.value;
      if (id==='radius') state.custom.radius = +e.target.value || 22;
      updatePalettePreview();
      generate();
    }
  });
});

function wireHeaderInputs(){
  document.getElementById('weekdayInput').addEventListener('input', (e)=>{ const day=getActiveDay(); day.header.weekday = e.target.value; renderAll(); });
  document.getElementById('dateInput').addEventListener('input', (e)=>{ const day=getActiveDay(); day.header.date = e.target.value; renderAll(); });
}

function wirePreset(){
  const select = document.getElementById('palettePreset');
  select.addEventListener('change', (e)=> applyPreset(e.target.value));
}

function renderDaySelector(){
  const sel = document.getElementById('daySelect');
  if (!sel) return;
  sel.innerHTML = '';
  state.days.forEach((d, i)=>{
    const opt = document.createElement('option');
    const label = (d.header && (d.header.weekday||d.header.date)) ? `${d.header.weekday||''} ${d.header.date||''}`.trim() : `Day ${i+1}`;
    opt.value = String(i);
    opt.textContent = label || `Day ${i+1}`;
    sel.appendChild(opt);
  });
  sel.value = String(state.currentDay);
}

function addDay(copyCurrent=true){
  const base = copyCurrent ? JSON.parse(JSON.stringify(getActiveDay())) : { header:getTodayHeader(), cards:[] };
  state.days.splice(state.currentDay+1, 0, base);
  state.currentDay = state.currentDay + 1;
  renderDaySelector();
  renderCardControls();
  const w = document.getElementById('weekdayInput'); if (w) w.value = base.header.weekday;
  const d = document.getElementById('dateInput'); if (d) d.value = base.header.date;
  renderAll();
}

function removeDay(){
  if (state.days.length <= 1) { alert('At least one day is required.'); return; }
  state.days.splice(state.currentDay,1);
  state.currentDay = Math.max(0, state.currentDay-1);
  renderDaySelector();
  renderCardControls();
  const active = getActiveDay();
  const w = document.getElementById('weekdayInput'); if (w) w.value = active.header.weekday;
  const d = document.getElementById('dateInput'); if (d) d.value = active.header.date;
  renderAll();
}

function wireDayControls(){
  const sel = document.getElementById('daySelect');
  if (sel){
    sel.addEventListener('change', (e)=>{
      const idx = Math.max(0, Math.min(parseInt(e.target.value||'0',10), state.days.length-1));
      state.currentDay = idx;
      const active = getActiveDay();
      const w = document.getElementById('weekdayInput'); if (w) w.value = active.header.weekday;
      const d = document.getElementById('dateInput'); if (d) d.value = active.header.date;
      renderCardControls();
      renderAll();
    });
  }
  const addBtn = document.getElementById('addDayBtn');
  if (addBtn){ addBtn.addEventListener('click', ()=> addDay(true)); }
  const remBtn = document.getElementById('removeDayBtn');
  if (remBtn){ remBtn.addEventListener('click', removeDay); }
}

function wireActions(){
  document.getElementById('addCardBtn').addEventListener('click', addCard);
  document.getElementById('generateBtn').addEventListener('click', renderAll);
  document.getElementById('exportBtn').addEventListener('click', exportPNG);
  document.getElementById('deleteAllBtn').addEventListener('click', ()=>{ if (confirm('Delete all cards?')) clearAll(); });
  document.getElementById('canvasW').addEventListener('input', (e)=>{ const w= Math.max(200, parseInt(e.target.value||'550',10)); state.canvas.width = w; setCanvasVars(state.canvas.width, state.canvas.height); renderAll(); measureUnitCardHeight(); });
  document.getElementById('canvasH').addEventListener('input', (e)=>{ const h= Math.max(300, parseInt(e.target.value||'1860',10)); state.canvas.height = h; setCanvasVars(state.canvas.width, state.canvas.height); renderAll(); measureUnitCardHeight(); });
  document.getElementById('exportJsonBtn').addEventListener('click', exportShareString);
  document.getElementById('importJsonBtn').addEventListener('click', importShareString);
}

function exportPNG(){
  const elements = Array.from(document.querySelectorAll('.apps-row .app'));
  const colors = currentColors();
  const TARGET_W = state.canvas.width;
  const tasks = elements.map((el, idx)=>
    html2canvas(el, { backgroundColor: colors.bg, scale: 2, windowWidth: TARGET_W })
      .then(canvas=>{
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        const day = state.days[idx];
        const label = (day && day.header && (day.header.weekday||day.header.date)) ? `-${(day.header.weekday||'day').toString().toLowerCase()}` : `-day${idx+1}`;
        a.download = `event${label}.png`;
        a.click();
      })
  );
  Promise.allSettled(tasks).catch(()=>{});
}

// ---------- Init ----------
function init(){
  // start with one example card for convenience
  const hadSaved = restoreState();
  if (!hadSaved){
    state.days = [{
      header: getTodayHeader(),
      cards: [
        { subject:'food', title:'Frokost', timeStart:'07:30', timeEnd:'09:00', location:'Suitene', cardUnits:1, subs:[], padImage:'' },
        { subject:'activity', title:'Aktiviteter', timeStart:'09:00', timeEnd:'16:00', location:'', cardUnits:1, subs:[ {subject:'food', title:'Lunsj', timeStart:'12:00', timeEnd:'13:00', location:'Festplassen'} ], padImage:'' },
      ]
    }];
    state.currentDay = 0;
  } else if (!Array.isArray(state.days) || !state.days.length){
    // migrate from legacy single-day shape if needed
    const legacyHeader = state.header || getTodayHeader();
    const legacyCards = state.cards || [];
    state.days = [{ header: legacyHeader, cards: legacyCards }];
    state.currentDay = 0;
  }
  setCanvasVars(state.canvas.width, state.canvas.height);
  renderCardControls();
  wireHeaderInputs();
  wirePreset();
  wireActions();
  wireDayControls();
  // reflect restored header/canvas/preset in controls
  const active = getActiveDay();
  document.getElementById('weekdayInput').value = active.header.weekday;
  document.getElementById('dateInput').value = active.header.date;
  document.getElementById('canvasW').value = state.canvas.width;
  document.getElementById('canvasH').value = state.canvas.height;
  document.getElementById('palettePreset').value = state.preset;
  applyPreset(state.preset);
  updatePalettePreview();
  renderDaySelector();
  renderAll();
  measureUnitCardHeight();
}

init();
</script>
</body>
